<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta · GameHub</title>
  <meta name="description" content="Crea tu cuenta de GameHub para guardar favoritos y escribir reseñas de videojuegos.">
  <meta name="theme-color" content="#080a10">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%238b7cf6'/%3E%3Cpath d='M10.5 11.5h11a4 4 0 0 1 3.9 3.1l.7 4.1a2.3 2.3 0 0 1-4.1 1.9l-1.2-1.6h-8.6l-1.2 1.6a2.3 2.3 0 0 1-4.1-1.9l.7-4.1a4 4 0 0 1 3.9-3.1Z' fill='none' stroke='%230d0a1e' stroke-width='1.7' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <div class="backdrop" aria-hidden="true"></div>

  <main id="main" class="auth">
    <div class="auth__shell">
      <a class="auth__back" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M19 12H5M11 18l-6-6 6-6"/>
        </svg>
        Volver al inicio
      </a>

      <section class="auth-card reveal" aria-labelledby="titulo-registro">
        <a class="brand" href="index.html">
          <svg class="brand__mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M17.32 5H6.68a4 4 0 0 0-3.98 3.59c-.01.05-.01.1-.02.15C2.6 9.42 2 14.46 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.41-1.41A2 2 0 0 1 9.83 16h4.34a2 2 0 0 1 1.42.59L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.55-.6-6.58-.68-7.26A4 4 0 0 0 17.32 5Z"/>
            <path d="M6 11h4M8 9v4"/>
            <path d="M15 12h.01M18 10h.01"/>
          </svg>
          <span class="brand__name">GameHub</span>
        </a>

        <h1 id="titulo-registro">Crear cuenta</h1>
        <p class="auth-card__sub">
          Guarda tus juegos favoritos y comparte reseñas con la comunidad.
          ¿Ya tienes una cuenta? <a href="login.html">Iniciar sesión</a>
        </p>

        <form class="form" data-auth-form data-form="registro" novalidate>
          <div class="field">
            <label for="registro-nombre">Nombre</label>
            <div class="control">
              <input
                id="registro-nombre"
                name="nombre"
                type="text"
                autocomplete="name"
                placeholder="Alex Mercer"
                data-validate="name"
                aria-describedby="registro-nombre-error"
                required>
            </div>
            <p class="field__error" id="registro-nombre-error"></p>
          </div>

          <div class="field">
            <label for="registro-email">Correo electrónico</label>
            <div class="control">
              <input
                id="registro-email"
                name="email"
                type="email"
                inputmode="email"
                autocomplete="email"
                spellcheck="false"
                placeholder="nombre@correo.com"
                data-validate="email"
                aria-describedby="registro-email-error"
                required>
            </div>
            <p class="field__error" id="registro-email-error"></p>
          </div>

          <div class="field">
            <label for="registro-password">Contraseña</label>
            <div class="control control--password">
              <input
                id="registro-password"
                name="password"
                type="password"
                autocomplete="new-password"
                placeholder="Crea una contraseña"
                minlength="8"
                data-validate="password"
                aria-describedby="registro-password-hint registro-password-error"
                required>
              <button
                class="password-toggle"
                type="button"
                data-password-toggle="registro-password"
                aria-pressed="false"
                aria-label="Mostrar contraseña">
                <svg class="icon-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                  <path d="M2.2 12S5.8 5.5 12 5.5 21.8 12 21.8 12 18.2 18.5 12 18.5 2.2 12 2.2 12Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="icon-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                  <path d="M10.6 6.1A9.7 9.7 0 0 1 12 6c6.2 0 9.8 6 9.8 6a17 17 0 0 1-2.8 3.5"/>
                  <path d="M6.4 7.9A16.8 16.8 0 0 0 2.2 12S5.8 18 12 18a9.6 9.6 0 0 0 3.5-.65"/>
                  <path d="m4 4 16 16"/>
                  <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
                </svg>
              </button>
            </div>
            <p class="field__hint" id="registro-password-hint">Mínimo 8 caracteres.</p>
            <p class="field__error" id="registro-password-error"></p>
          </div>

          <div class="field">
            <label for="registro-confirmar">Confirmar contraseña</label>
            <div class="control control--password">
              <input
                id="registro-confirmar"
                name="confirmar"
                type="password"
                autocomplete="new-password"
                placeholder="Repite tu contraseña"
                data-validate="confirm"
                aria-describedby="registro-confirmar-error"
                required>
              <button
                class="password-toggle"
                type="button"
                data-password-toggle="registro-confirmar"
                aria-pressed="false"
                aria-label="Mostrar contraseña">
                <svg class="icon-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                  <path d="M2.2 12S5.8 5.5 12 5.5 21.8 12 21.8 12 18.2 18.5 12 18.5 2.2 12 2.2 12Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="icon-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                  <path d="M10.6 6.1A9.7 9.7 0 0 1 12 6c6.2 0 9.8 6 9.8 6a17 17 0 0 1-2.8 3.5"/>
                  <path d="M6.4 7.9A16.8 16.8 0 0 0 2.2 12S5.8 18 12 18a9.6 9.6 0 0 0 3.5-.65"/>
                  <path d="m4 4 16 16"/>
                  <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
                </svg>
              </button>
            </div>
            <p class="field__error" id="registro-confirmar-error"></p>
          </div>

          <button class="btn btn--primary btn--block" type="submit">Crear cuenta</button>
          <p class="form__status" role="status" aria-live="polite"></p>
        </form>
      </section>

      <p class="auth__note">Demostración sin base de datos: los datos no se envían a ningún servidor.</p>
    </div>
  </main>
</body>
</html>
